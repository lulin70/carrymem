[build-system]
requires = ["setuptools>=84.1.0", "wheel", "setuptools_scm[toml]>=10.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "carrymem"
version = "0.11.2"
description = "Portable AI memory for MCP-compatible local clients. Classify, store, and recall what matters."
requires-python = ">=3.12"
authors = [{name = "lulin70", email = "lulin70@gmail.com"}]
license = {text = "MIT"}
keywords = ["ai", "memory", "classification", "mcp", "agent", "persistence", "portable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=5.0",
    "cryptography>=50.0.0",
    "rich>=13.0",
]

[project.optional-dependencies]
language = [
    "pycld2>=0.41",
    "langdetect>=1.0.9",
]
semantic = [
    "sqlite-vec>=0.1.0",
    "pysqlite3>=0.6.0",
    "sentence-transformers>=5.6.0",
]
async = [
    "aiosqlite>=0.19",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.0",
    "coverage[toml]>=7.0",
    "pre-commit>=3.0",
    "build>=0.10",
    "twine>=4.0",
    "pycld2>=0.41",
    "langdetect>=1.0.9",
    "flake8==7.3.0",
    "black==26.10.1",
    "isort==6.1.0",
    "mypy==2.3.0",
    "radon==6.0.1",
    "bandit==1.7.10",
    "pip-audit==2.7.0",
]
llm = [
    "openai>=1.0",
    "zai-sdk>=0.2.3",
]
tui = [
    "textual>=8.2.8",
]
full = [
    "pycld2>=0.41",
    "langdetect>=1.0.9",
    "textual>=8.2.8",
    "sqlite-vec>=0.1.0",
    "pysqlite3>=0.6.0",
    "sentence-transformers>=5.6.0",
    "openai>=1.0",
    "zai-sdk>=0.2.3",
    "aiosqlite>=0.19",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/carrymem",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "release_gate: marks stable release-critical regression tests",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async (requires pytest-asyncio)",
    "coverage: marks tests as type annotation coverage tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/carrymem"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/build/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.black]
line-length = 120
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/build/*", "*/dist/*", "*/.venv/*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Lock rule set to prevent ruff version upgrades from introducing new default rules.
# Reference: project_memory lesson "CI must use versions from requirements-dev.txt
# instead of hard-pinning dependencies like ruff, mypy, and black"
# E4/E7/E9: pycodestyle errors (syntax, statement, indentation)
# F: pyflakes (undefined names, unused imports, etc.)
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
follow_imports = "normal"
ignore_missing_imports = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "tests/",
]
