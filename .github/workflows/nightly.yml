name: Nightly Slow Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  slow-tests:
    name: Slow Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('setup.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || {
            pip install pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio coverage[toml]
            pip install pycld2 langdetect 2>/dev/null || true
          }

      - name: Run slow tests
        env:
          CI: "true"
        run: |
          python -m pytest tests/ \
            -m "slow" \
            --tb=long \
            --timeout=1800 \
            -q
