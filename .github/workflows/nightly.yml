name: Nightly Slow Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow-tests:
    name: Slow Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('setup.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev]" || {
            pip install pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio coverage[toml]
            pip install pycld2 langdetect 2>/dev/null || true
          }

      - name: Run slow tests
        env:
          CI: "true"
        run: |
          python -m pytest tests/ \
            -m "slow" \
            --tb=long \
            --timeout=1800 \
            -q

  # ═══════════════════════════════════════
  # Nightly: VSCode Extension Tier 2 UI E2E (TD-034)
  #   Runs 5 VSCode UI user journeys via @vscode/test-electron.
  #   User rule 3): "发布前必须做模拟真实用户使用的测试"
  # ═══════════════════════════════════════
  vscode-e2e:
    name: VSCode Tier 2 UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install extension dependencies
        working-directory: extensions/vscode-carrymem
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: extensions/vscode-carrymem
        run: npx tsc -p ./

      - name: Copy runner scripts to out/
        working-directory: extensions/vscode-carrymem
        run: |
          cp test/runUnitTests.js out/test/
          cp test/runVscodeTests.js out/test/

      - name: Run VSCode Tier 2 UI E2E (xvfb)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e
          working-directory: extensions/vscode-carrymem

  # ═══════════════════════════════════════
  # Nightly: Vector/Semantic Tests (TD-012)
  #   Runs vector search tests that are skipped in main CI (sentence-transformers too heavy).
  #   Install [semantic] extra and run tests/test_vector_search.py + semantic-related tests.
  # ═══════════════════════════════════════
  vector-tests:
    name: Vector/Semantic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies with [semantic] extra
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev,async,semantic]"

      - name: Run vector search tests
        env:
          CI: "true"
        run: |
          python -m pytest tests/test_vector_search.py \
            --tb=long \
            --timeout=600 \
            -v
