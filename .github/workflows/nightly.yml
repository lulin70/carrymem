name: Nightly Slow Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  slow-tests:
    name: Slow Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('setup.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev]" || {
            pip install pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio coverage[toml]
            pip install pycld2 langdetect 2>/dev/null || true
          }

      - name: Run slow tests
        env:
          CI: "true"
        run: |
          python -m pytest tests/ \
            -m "slow" \
            --tb=long \
            --timeout=1800 \
            -q

  # ═══════════════════════════════════════
  # Nightly: VSCode Extension Tier 2 UI E2E (TD-034)
  #   Runs 5 VSCode UI user journeys via @vscode/test-electron.
  #   User rule 3): "发布前必须做模拟真实用户使用的测试"
  # ═══════════════════════════════════════
  vscode-e2e:
    name: VSCode Tier 2 UI E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extension dependencies
        working-directory: extensions/vscode-carrymem
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: extensions/vscode-carrymem
        run: npx tsc -p ./

      - name: Copy runner scripts to out/
        working-directory: extensions/vscode-carrymem
        run: |
          cp test/runUnitTests.js out/test/
          cp test/runVscodeTests.js out/test/

      - name: Run VSCode Tier 2 UI E2E (xvfb)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e
          working-directory: extensions/vscode-carrymem

  # ═══════════════════════════════════════
  # Nightly: Vector/Semantic Tests (TD-012)
  #   Runs vector search tests that are skipped in main CI (sentence-transformers too heavy).
  #   Install [semantic] extra and run tests/test_vector_search.py + semantic-related tests.
  # ═══════════════════════════════════════
  vector-tests:
    name: Vector/Semantic Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache HuggingFace model weights to avoid re-downloading all-MiniLM-L6-v2 (~90MB)
      # on every nightly run. Without this, SentenceTransformer("all-MiniLM-L6-v2")
      # fails because the code sets TRANSFORMERS_OFFLINE=1 (see sqlite/__init__.py:72),
      # which blocks online downloads — so the model must be pre-cached.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-all-MiniLM-L6-v2-v1

      - name: Install dependencies with [semantic] extra
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev,async,semantic]"

      # Pre-download the embedding model weights so TRANSFORMERS_OFFLINE=1 in
      # _get_or_load_embedding_model() finds the cached weights. Without this,
      # _setup_vector_search() catches the OSError and silently disables vector
      # search, causing all vector tests to fail with "assert False is True".
      - name: Pre-download embedding model
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run vector search tests
        env:
          CI: "true"
        run: |
          python -m pytest tests/test_vector_search.py \
            --tb=long \
            --timeout=600 \
            -v

  # ═══════════════════════════════════════
  # TD-042: Failure notification — auto-create GitHub Issue when nightly fails
  #   Runs only if any of the above jobs (slow-tests/vscode-e2e/vector-tests) fails.
  #   User rule 3): "发布前必须做模拟真实用户使用的测试" — nightly guards this,
  #   so silent failures must be surfaced as actionable issues.
  # ═══════════════════════════════════════
  notify-failure:
    name: Notify Nightly Failure
    runs-on: ubuntu-latest
    needs: [slow-tests, vscode-e2e, vector-tests]
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue for nightly failure
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed — ${date}`,
              body: [
                `## Nightly Build Failure`,
                ``,
                `**Date**: ${date}`,
                `**Run**: ${runUrl}`,
                `**Triggered by**: ${context.eventName}`,
                ``,
                `### Failed jobs`,
                `The nightly workflow failed. Please investigate the failing jobs.`,
                ``,
                `### Action items`,
                `1. Check the [workflow run](${runUrl}) for details`,
                `2. Identify the failing job(s) and re-run if flaky`,
                `3. Fix the root cause or file a bug report`,
                `4. Close this issue once resolved`,
                ``,
                `> This issue was auto-created by the \`notify-failure\` job (TD-042).`,
              ].join('\n'),
              labels: ['nightly-failure', 'bug', 'devops']
            });
