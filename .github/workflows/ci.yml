name: CI Pipeline

on:
  push:
    branches: [new-main]
    tags: ['v*']
  pull_request:
    branches: [new-main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════
  # GATE 0: Quick syntax check (blocking — zero-cost gate, C3)
  # ═══════════════════════════════════════
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Compile all .py files
        run: |
          find src tests -name "*.py" ! -path "*__pycache__*" -exec python3 -m py_compile {} + 2>&1 && \
            echo "OK: all files compiled" || echo "WARNING: compile errors (see above)"

  # ═══════════════════════════════════════
  # GATE 1: Unit Tests (HARD GATE)
  # ═══════════════════════════════════════
  test:
    name: Tests (py${{ matrix.python-version }} on ${{ matrix.os }})
    needs: [syntax]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, macos-latest]
          python-version: ['3.12']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('setup.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          # Install with error handling for optional deps that may need system libs
          # [async] extra (aiosqlite) is required for test_async_sqlite.py — do not drop on fallback
          # [tui] extra (textual) is required for test_tui.py — TD-011: install in main test job
          pip install -e ".[dev,async,tui]" || {
            echo "WARNING: Full dev install failed, retrying without language extras"
            pip install -e ".[dev,async,tui]" --no-deps 2>/dev/null || true
            pip install pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio coverage[toml] build twine black isort flake8 mypy aiosqlite textual
            pip install pycld2 langdetect 2>/dev/null || echo "NOTE: pycld2/langdetect skipped (need libicu-dev)"
          }

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ \
            --cov=carrymem \
            --cov-report=term-missing \
            --tb=long \
            --timeout=120 \
            -m "not slow" \
            -q 2>&1 | tee /tmp/test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-py${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            ./coverage.xml
            .coverage
            /tmp/test_output.txt
          if-no-files-found: ignore

  # ═══════════════════════════════════════
  # GATE 2: Build & Fresh Install
  # ═══════════════════════════════════════
  build:
    name: Build & Install Test
    needs: [syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install build twine

      - name: Build sdist and wheel
        run: |
          rm -rf dist/ build/ *.egg-info/
          python -m build

      - name: List artifacts
        run: ls -lh dist/

      - name: twine check
        run: twine check dist/*

      - name: Fresh install from wheel
        run: |
          python -m venv /tmp/carrymem_venv
          /tmp/carrymem_venv/bin/pip install $(ls dist/carrymem-*.whl | head -1)
          /tmp/carrymem_venv/bin/python -c "import carrymem; print(f'Version: {carrymem.__version__}')"
          echo "OK: fresh install works"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/

  # ═══════════════════════════════════════
  # BLOCKING: Code Quality Gate (flake8+black+isort+mypy)
  # ═══════════════════════════════════════
  lint:
    name: Lint (Quality Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          # TD-025: pin linter versions to match .pre-commit-config.yaml
          pip install flake8==7.3.0 black==26.5.1 isort==6.1.0 mypy==2.3.0 radon==6.0.1
          # Install runtime deps so mypy can resolve real types (rich/textual/aiosqlite).
          # Without these, mypy treats them as Any and flags type:ignore as unused.
          pip install rich>=13.0 textual>=0.40 aiosqlite>=0.19 cryptography>=46.0.6 PyYAML>=5.0

      - name: flake8
        run: flake8 src/ tests/ --count --max-line-length=120 --statistics

      - name: Black
        run: black --check --diff --color --line-length=120 src/ tests/

      - name: isort
        run: isort --check-only --diff src/ tests/

      - name: mypy
        run: mypy src/

      - name: "radon cc check (blocking for complexity >=21)"
        continue-on-error: false
        run: |
          # Project constraint: blocking for complexity >=21 (D+ level).
          # Promoted from advisory on 2026-09-07: the last >=21 function
          # (upgrade_to_rule, cc=24) was refactored to cc=10, so the whole
          # src/ tree is now D+-free and the gate must stay honest.
          OUTPUT=$(radon cc -s -n D src/ 2>&1)
          if [ -n "$OUTPUT" ]; then
            echo "FAIL: Functions with complexity >=21 (grade D+) found:"
            echo "$OUTPUT"
            exit 1
          else
            echo "OK: No functions with complexity >=21"
          fi

  # ═══════════════════════════════════════
  # ADVISORY: i18n Compliance (non-blocking)
  # ═══════════════════════════════════════
  i18n:
    name: i18n Check (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check for Chinese in non-i18n files
        run: |
          python3 << 'EOF'
          import os, re, sys
          whitelist = [
              'language.py','context.py','pattern_analyzer.py','tools.py',
              '__main__.py','__init__.py','confirmation.py','expander.py',
              'merger.py','failure_experience.py','sanitizer.py','matcher.py',
              'injector.py','templates.py','conflict_detector.py',
              'pattern_detector.py','storage.py','coreference.py',
              'domain.py','scope.py','prompt.py','format.py',
              'candidate_generator.py','handlers.py','sqlite_adapter.py',
              'semantic_aggregator.py','session_summarizer.py',
          ]
          errors = []
          for root, dirs, files in os.walk('src'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if not f.endswith('.py'): continue
                  fp = os.path.join(root, f)
                  relpath = os.path.relpath(fp)
                  if any(w in relpath for w in whitelist): continue
                  try:
                      for lineno, line in enumerate(open(fp), 1):
                          if re.search(r'[\u4e00-\u9fff]', line):
                              errors.append(f"{relpath}:{lineno}")
                  except: pass
          if errors:
              print(f"WARNING: {len(errors)} lines with CJK (whitelisted i18n data)")
              for e in errors[:10]: print(f"  {e}")
          else:
              print("OK: No CJK outside i18n whitelisted files")
          EOF

  # ═══════════════════════════════════════
  # SECURITY: Security Scan (blocking for HIGH+)
  # ═══════════════════════════════════════
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Check secrets
        run: |
          grep -rnE "(api_key|secret_key|password|token)\s*=\s*['\"][^']{8,}" src/ --include="*.py" | \
            grep -v "test_" | grep -v "# " | grep -v "os.environ" | grep -v "getenv" && \
            echo "WARNING: potential hardcoded secret" || echo "OK: no obvious secrets"

      - name: Check bare except
        run: |
          grep -rn "except:" src/ --include="*.py" | grep -v "except Exception" | grep -v "except (" && \
            echo "WARNING: bare except found" || echo "OK: no bare except"

      - name: bandit scan (blocking for HIGH severity)
        run: bandit -r src/ -lll --format=txt

      - name: pip-audit (dependency vulnerability scan)
        run: |
          # Use isolated venv so we only audit carrymem's actual dependencies,
          # not the runner's pre-installed system packages (which would produce
          # 50+ false positives unrelated to this project).
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --upgrade pip
          /tmp/audit-venv/bin/pip install -e .
          /tmp/audit-venv/bin/pip install pip-audit
          # --no-deps: carrymem itself is local (not on PyPI); audit only dependencies
          /tmp/audit-venv/bin/pip-audit --desc

  # ═══════════════════════════════════════
  # ADVISORY: Docs Check (non-blocking)
  # ═══════════════════════════════════════
  docs:
    name: Docs Check (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Verify required docs exist
        run: |
          for doc in README.md CONTRIBUTING.md LICENSE CHANGELOG.md SECURITY.md; do
            [ -f "$doc" ] && echo "OK: $doc" || echo "MISSING: $doc"
          done

  # ═══════════════════════════════════════
  # ADVISORY: Optional Deps Test (non-blocking)
  #   Detects import errors in optional-dependency code paths
  #   (textual TUI, cryptography, openai/zhipuai LLM, pycld2/langdetect).
  #   Excludes semantic extras (sentence-transformers is heavy).
  # ═══════════════════════════════════════
  optional-deps:
    name: Optional Deps Test (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install with optional deps (excl. semantic)
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -e ".[dev,async,tui,encryption,llm,language]" || {
            echo "WARNING: optional-deps install failed; skipping job"
            exit 1
          }

      - name: Run optional-dep tests
        run: |
          python -m pytest tests/ \
            --timeout=120 \
            -m "not slow" \
            -q 2>&1 | tee /tmp/optional_test_output.txt

  # ═══════════════════════════════════════
  # VSCode Extension Tests (Tier 1 — unit/integration, no VSCode required)
  #   Runs CarryMemClient integration tests via mocha in plain Node.
  #   Tier 2 (VSCode UI E2E via @vscode/test-electron) runs locally/nightly.
  # ═══════════════════════════════════════
  vscode-ext:
    name: VSCode Extension Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install extension dependencies
        working-directory: extensions/vscode-carrymem
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: extensions/vscode-carrymem
        run: npx tsc -p ./

      - name: Copy runner scripts to out/
        working-directory: extensions/vscode-carrymem
        run: cp test/*.js out/test/

      - name: Run Tier 1 integration tests
        working-directory: extensions/vscode-carrymem
        run: node ./out/test/runUnitTests.js

  # ═══════════════════════════════════════
  # GATE 3: Docker Build (P2-2)
  #   Validates that Dockerfile builds successfully and the resulting
  #   image can start the MCP server. Runs after test+build to avoid
  #   wasting CI minutes on known-broken code.
  #   Does NOT push to registry (push is a release-time concern).
  # ═══════════════════════════════════════
  docker-build:
    name: Docker Build
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: carrymem:ci-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container starts + import works)
        run: |
          # Verify the image can import carrymem — validates: (1) wheel installed,
          # (2) deps installed, (3) import works, (4) torch CUDA OSError is caught.
          # --kill-after=5: send SIGKILL 5s after SIGTERM. Without this, `timeout`
          #   hangs forever because `docker run` does NOT propagate SIGTERM to the
          #   container (confirmed in CI run 30142136016: smoke test ran 9+ min
          #   with `timeout 60` and never exited).
          # --init: use tini as PID 1 inside the container for proper signal
          #   forwarding to the python process.
          # 120s timeout: torch import in CPU-only slim image can take 30-60s
          #   (tries multiple CUDA lib paths before raising OSError, which is
          #   caught by the widened `except (ImportError, OSError, ValueError)`).
          timeout --kill-after=5 120 docker run --rm --init \
            -v carrymem-smoke-data:/data \
            -e CARRYMEM_DATA_PATH=/data \
            carrymem:ci-${{ github.sha }} \
            python -c "import carrymem; print('OK: version=' + carrymem.__version__)"

          # Cleanup
          docker volume rm carrymem-smoke-data || true

      - name: Show image size
        run: |
          docker images carrymem:ci-${{ github.sha }} --format 'Image: {{.Repository}}:{{.Tag}} Size: {{.Size}}'
