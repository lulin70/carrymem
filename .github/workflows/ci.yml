name: CI Pipeline

on:
  push:
    branches: [new-main]
    tags: ['v*']
  pull_request:
    branches: [new-main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════
  # GATE 0: Quick syntax check (advisory)
  # ═══════════════════════════════════════
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile all .py files
        run: |
          find src tests -name "*.py" ! -path "*__pycache__*" -exec python3 -m py_compile {} + 2>&1 && \
            echo "OK: all files compiled" || echo "WARNING: compile errors (see above)"

  # ═══════════════════════════════════════
  # GATE 1: Unit Tests (HARD GATE)
  # ═══════════════════════════════════════
  test:
    name: Tests (py${{ matrix.python-version }})
    needs: [syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
        fail-fast: false
        matrix:
          python-version: ['3.12']

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('setup.py') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install with error handling for optional deps that may need system libs
          pip install -e ".[dev]" || {
            echo "WARNING: Full dev install failed, retrying without language extras"
            pip install -e ".[dev]" --no-deps 2>/dev/null || true
            pip install pytest pytest-cov pytest-mock pytest-timeout pytest-asyncio coverage[toml] build twine black isort flake8 mypy
            pip install pycld2 langdetect 2>/dev/null || echo "NOTE: pycld2/langdetect skipped (need libicu-dev)"
          }

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ \
            --cov=carrymem \
            --cov-report=term-missing \
            --tb=long \
            --timeout=120 \
            -m "not slow" \
            -q 2>&1 | tee /tmp/test_output.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            ./coverage.xml
            .coverage
            /tmp/test_output.txt
          if-no-files-found: ignore

  # ═══════════════════════════════════════
  # GATE 2: Build & Fresh Install
  # ═══════════════════════════════════════
  build:
    name: Build & Install Test
    needs: [syntax]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          rm -rf dist/ build/ *.egg-info/
          python -m build

      - name: List artifacts
        run: ls -lh dist/

      - name: twine check
        run: twine check dist/*

      - name: Fresh install from wheel
        run: |
          python -m venv /tmp/carrymem_venv
          /tmp/carrymem_venv/bin/pip install $(ls dist/carrymem-*.whl | head -1)
          /tmp/carrymem_venv/bin/python -c "import carrymem; print(f'Version: {carrymem.__version__}')"
          echo "OK: fresh install works"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/

  # ═══════════════════════════════════════
  # ADVISORY: Code Quality (non-blocking)
  # ═══════════════════════════════════════
  lint:
    name: Lint (Quality Gate)
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy

      - name: flake8
        run: flake8 src/ tests/ --count --max-line-length=120 --statistics

      - name: Black
        run: black --check --diff --color --line-length=120 src/ tests/

      - name: isort
        run: isort --check-only --diff src/ tests/

      - name: mypy
        run: mypy src/ --config-file mypy.ini

  # ═══════════════════════════════════════
  # ADVISORY: i18n Compliance (non-blocking)
  # ═══════════════════════════════════════
  i18n:
    name: i18n Check (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for Chinese in non-i18n files
        run: |
          python3 << 'EOF'
          import os, re, sys
          whitelist = [
              'language.py','context.py','pattern_analyzer.py','tools.py',
              '__main__.py','__init__.py','confirmation.py','expander.py',
              'merger.py','failure_experience.py','sanitizer.py','matcher.py',
              'injector.py','templates.py','conflict_detector.py',
              'pattern_detector.py','storage.py','coreference.py',
              'domain.py','scope.py','prompt.py','format.py',
              'candidate_generator.py','handlers.py','sqlite_adapter.py',
              'semantic_aggregator.py','session_summarizer.py',
          ]
          errors = []
          for root, dirs, files in os.walk('src'):
              dirs[:] = [d for d in dirs if d != '__pycache__']
              for f in files:
                  if not f.endswith('.py'): continue
                  fp = os.path.join(root, f)
                  relpath = os.path.relpath(fp)
                  if any(w in relpath for w in whitelist): continue
                  try:
                      for lineno, line in enumerate(open(fp), 1):
                          if re.search(r'[\u4e00-\u9fff]', line):
                              errors.append(f"{relpath}:{lineno}")
                  except: pass
          if errors:
              print(f"WARNING: {len(errors)} lines with CJK (whitelisted i18n data)")
              for e in errors[:10]: print(f"  {e}")
          else:
              print("OK: No CJK outside i18n whitelisted files")
          EOF

  # ═══════════════════════════════════════
  # ADVISORY: Security Scan (non-blocking)
  # ═══════════════════════════════════════
  security:
    name: Security (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install security tools
        run: pip install bandit

      - name: Check secrets
        run: |
          grep -rnE "(api_key|secret_key|password|token)\s*=\s*['\"][^']{8,}" src/ --include="*.py" | \
            grep -v "test_" | grep -v "# " | grep -v "os.environ" | grep -v "getenv" && \
            echo "WARNING: potential hardcoded secret" || echo "OK: no obvious secrets"

      - name: Check bare except
        run: |
          grep -rn "except:" src/ --include="*.py" | grep -v "except Exception" | grep -v "except (" && \
            echo "WARNING: bare except found" || echo "OK: no bare except"

      - name: bandit scan
        run: bandit -r src/ -ll -ii --format=txt || true

  # ═══════════════════════════════════════
  # ADVISORY: Docs Check (non-blocking)
  # ═══════════════════════════════════════
  docs:
    name: Docs Check (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Verify required docs exist
        run: |
          for doc in README.md CONTRIBUTING.md LICENSE CHANGELOG.md SECURITY.md; do
            [ -f "$doc" ] && echo "OK: $doc" || echo "MISSING: $doc"
          done

  # ═══════════════════════════════════════
  # ADVISORY: Optional Deps Test (non-blocking)
  #   Detects import errors in optional-dependency code paths
  #   (textual TUI, cryptography, openai/zhipuai LLM, pycld2/langdetect).
  #   Excludes semantic extras (sentence-transformers is heavy).
  # ═══════════════════════════════════════
  optional-deps:
    name: Optional Deps Test (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install with optional deps (excl. semantic)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,tui,encryption,llm,language]" || {
            echo "WARNING: optional-deps install failed; skipping job"
            exit 1
          }

      - name: Run optional-dep tests
        run: |
          python -m pytest tests/ \
            --timeout=120 \
            -m "not slow" \
            -q 2>&1 | tee /tmp/optional_test_output.txt
