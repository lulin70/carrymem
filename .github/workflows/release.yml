name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ═══════════════════════════════════════
  # GATE: Run tests before any publish
  # ═══════════════════════════════════════
  pre-release-test:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,async]"

      - name: Install lint & security tools
        run: |
          pip install flake8 black isort mypy bandit pip-audit

      - name: Lint — flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Lint — black --check
        run: |
          black --check src/ tests/

      - name: Lint — isort --check
        run: |
          isort --check-only src/ tests/

      - name: Type check — mypy
        run: |
          mypy src/carrymem/ --ignore-missing-imports

      - name: Security — bandit
        run: |
          bandit -r src/carrymem/ -ll

      - name: Security — pip-audit
        run: |
          pip-audit

      - name: Run tests (gate — must pass before publish)
        run: |
          python -m pytest tests/ \
            --cov=carrymem \
            --cov-report=term-missing \
            --timeout=120 \
            -m "not slow" \
            -q

      - name: Verify coverage threshold
        run: |
          python -m pytest tests/ --cov=carrymem --cov-report=term --timeout=120 -m "not slow" -q --no-header | tail -5
          python -c "
          import coverage
          cov = coverage.Coverage()
          cov.load()
          total = cov.report()
          if total < 80.0:
              print(f'FAIL: Coverage {total:.2f}% < 80% threshold')
              exit(1)
          print(f'OK: Coverage {total:.2f}% >= 80% threshold')
          "

  release:
    name: Build & Publish
    needs: [pre-release-test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify version consistency (tag == built wheel)
        run: |
          # Extract tag version (strip leading 'v')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract built wheel version
          WHEEL=$(ls dist/carrymem-*.whl | head -1)
          WHEEL_VERSION=$(echo "$WHEEL" | sed -n 's/.*carrymem-\([^-]*\)-.*/\1/p')
          echo "Tag version:    $TAG_VERSION"
          echo "Wheel version:  $WHEEL_VERSION"
          if [ "$TAG_VERSION" != "$WHEEL_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match built wheel version ($WHEEL_VERSION)"
            exit 1
          fi
          echo "Version consistency verified: $TAG_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
