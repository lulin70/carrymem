name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ═══════════════════════════════════════
  # GATE: Run tests before any publish
  # ═══════════════════════════════════════
  pre-release-test:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          # TD-011: include [tui] so test_tui.py runs in pre-release gate
          pip install -e ".[dev,async,tui]"

      - name: Install lint & security tools
        run: |
          pip install flake8 black isort mypy bandit pip-audit

      - name: Lint — flake8
        run: |
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Lint — black --check
        run: |
          black --check src/ tests/

      - name: Lint — isort --check
        run: |
          isort --check-only src/ tests/

      - name: Type check — mypy
        run: |
          mypy src/carrymem/ --ignore-missing-imports

      - name: Security — bandit
        run: |
          bandit -r src/carrymem/ -ll

      - name: Security — pip-audit
        run: |
          pip-audit

      - name: Run tests (gate — must pass before publish)
        run: |
          python -m pytest tests/ \
            --cov=carrymem \
            --cov-report=term-missing \
            --timeout=120 \
            -m "not slow" \
            -q

      - name: Verify coverage threshold
        run: |
          # Reuse .coverage file generated by previous "Run tests" step (avoid duplicate pytest run)
          python -c "
          import coverage
          cov = coverage.Coverage()
          cov.load()
          total = cov.report()
          if total < 80.0:
              print(f'FAIL: Coverage {total:.2f}% < 80% threshold')
              exit(1)
          print(f'OK: Coverage {total:.2f}% >= 80% threshold')
          "

  # ═══════════════════════════════════════
  # GATE: End-to-end tests (user rule: "发布前必须做模拟真实用户使用的测试")
  # TD-033: Explicit e2e gate — runs tests/e2e/ suite separately for clarity
  # ═══════════════════════════════════════
  e2e-gate:
    name: E2E Tests (User Journey Gate)
    needs: [pre-release-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          # TD-011: include [tui] so test_tui.py runs in pre-release gate
          pip install -e ".[dev,async,tui]"

      - name: Run E2E test suite (user journey simulation)
        run: |
          python -m pytest tests/e2e/ \
            --timeout=300 \
            -m "not slow" \
            -v

  # ═══════════════════════════════════════
  # GATE: VSCode Extension Tier 2 UI E2E (user rule: "模拟真实用户使用的测试")
  # TD-034: Runs 5 VSCode UI user journeys via @vscode/test-electron
  # ═══════════════════════════════════════
  vscode-e2e:
    name: VSCode Tier 2 UI E2E
    needs: [pre-release-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install extension dependencies
        working-directory: extensions/vscode-carrymem
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: extensions/vscode-carrymem
        run: npx tsc -p ./

      - name: Copy runner scripts to out/
        working-directory: extensions/vscode-carrymem
        run: |
          cp test/runUnitTests.js out/test/
          cp test/runVscodeTests.js out/test/

      - name: Run VSCode Tier 2 UI E2E (xvfb)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e
          working-directory: extensions/vscode-carrymem

  release:
    name: Build & Publish
    needs: [pre-release-test, e2e-gate, vscode-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify version consistency (tag == built wheel)
        run: |
          # Extract tag version (strip leading 'v')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract built wheel version
          WHEEL=$(ls dist/carrymem-*.whl | head -1)
          WHEEL_VERSION=$(echo "$WHEEL" | sed -n 's/.*carrymem-\([^-]*\)-.*/\1/p')
          echo "Tag version:    $TAG_VERSION"
          echo "Wheel version:  $WHEEL_VERSION"
          if [ "$TAG_VERSION" != "$WHEEL_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match built wheel version ($WHEEL_VERSION)"
            exit 1
          fi
          echo "Version consistency verified: $TAG_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
