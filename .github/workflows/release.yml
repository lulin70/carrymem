name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ═══════════════════════════════════════
  # GATE: Run tests before any publish
  # ═══════════════════════════════════════
  pre-release-test:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          # TD-011: include [tui] so test_tui.py runs in pre-release gate
          pip install -e ".[dev,async,tui]"

      - name: Install lint & security tools
        run: |
          # TD-025: pin linter versions to match .pre-commit-config.yaml
          pip install flake8==7.3.0 black==26.5.1 isort==6.1.0 mypy==2.3.0 bandit==1.7.10 pip-audit==2.7.0

      - name: Lint — flake8
        run: |
          # Rely on .flake8 config (extend-ignore includes E203/W503/F403/F405/E402/E731/E712/F541/W391 etc.)
          # --extend-ignore on CLI would OVERWRITE the config file's list, not append.
          flake8 src/ tests/ --max-line-length=120 --statistics

      - name: Lint — black --check
        run: |
          black --check src/ tests/

      - name: Lint — isort --check
        run: |
          isort --check-only src/ tests/

      - name: Type check — mypy
        run: |
          # Align with ci.yml L180: `mypy src/` auto-reads pyproject.toml [tool.mypy]
          # --ignore-missing-imports was removed because pyproject.toml already
          # configures mypy properly, and the flag would mask real type errors.
          # Runtime deps (rich/textual/aiosqlite/cryptography) are installed via
          # the `[dev,async,tui]` extras in the previous step.
          mypy src/

      - name: Security — bandit
        run: |
          # -lll = fail only on HIGH severity (aligns with ci.yml L271)
          # -ll would fail on LOW+ which produces 95 false-positive issues
          bandit -r src/carrymem/ -lll

      - name: Security — pip-audit
        run: |
          # Isolated venv to audit only carrymem's actual dependencies
          # (aligns with ci.yml L274-283). Running `pip-audit` directly would
          # audit the runner's pre-installed system packages, producing 50+
          # false positives unrelated to this project.
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --upgrade pip
          /tmp/audit-venv/bin/pip install -e .
          /tmp/audit-venv/bin/pip install pip-audit
          # --desc: show vulnerability descriptions
          /tmp/audit-venv/bin/pip-audit --desc

      - name: Run tests (gate — must pass before publish)
        run: |
          python -m pytest tests/ \
            --cov=carrymem \
            --cov-report=term-missing \
            --timeout=120 \
            -m "not slow" \
            -q

      - name: Verify coverage threshold
        run: |
          # Reuse .coverage file generated by previous "Run tests" step (avoid duplicate pytest run)
          python -c "
          import coverage
          cov = coverage.Coverage()
          cov.load()
          total = cov.report()
          if total < 80.0:
              print(f'FAIL: Coverage {total:.2f}% < 80% threshold')
              exit(1)
          print(f'OK: Coverage {total:.2f}% >= 80% threshold')
          "

  # ═══════════════════════════════════════
  # GATE: End-to-end tests (user rule: "发布前必须做模拟真实用户使用的测试")
  # TD-033: Explicit e2e gate — runs tests/e2e/ suite separately for clarity
  # ═══════════════════════════════════════
  e2e-gate:
    name: E2E Tests (User Journey Gate)
    needs: [pre-release-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          # TD-011: include [tui] so test_tui.py runs in pre-release gate
          pip install -e ".[dev,async,tui]"

      - name: Run E2E test suite (user journey simulation)
        run: |
          # --no-cov: e2e tests validate user journeys, not coverage.
          # pyproject.toml [tool.pytest.ini_options] enables --cov by default,
          # which would fail with ~40% coverage (only e2e/ subset runs).
          python -m pytest tests/e2e/ \
            --no-cov \
            --timeout=300 \
            -m "not slow" \
            -v

  # ═══════════════════════════════════════
  # GATE: VSCode Extension Tier 2 UI E2E (user rule: "模拟真实用户使用的测试")
  # TD-034: Runs 5 VSCode UI user journeys via @vscode/test-electron
  # ═══════════════════════════════════════
  vscode-e2e:
    name: VSCode Tier 2 UI E2E
    needs: [pre-release-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install extension dependencies
        working-directory: extensions/vscode-carrymem
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: extensions/vscode-carrymem
        run: npx tsc -p ./

      - name: Copy runner scripts to out/
        working-directory: extensions/vscode-carrymem
        run: cp test/*.js out/test/

      - name: Run VSCode Tier 2 UI E2E (xvfb)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm run test:e2e
          working-directory: extensions/vscode-carrymem

  release:
    name: Build & Publish
    # vscode-e2e re-added to the needs chain (C2, 2026-09-07): the historical
    # module resolution issues ("Cannot find module '/undefined'" and missing
    # out/src/package.json) were fixed in runVscodeTests.js (correct
    # extensionDevelopmentPath / extensionTestsPath) — nightly run 30145432223
    # passed 17/17 journeys (216ms, exit 0).
    needs: [pre-release-test, e2e-gate, vscode-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # TD-015 step 2: OIDC migration — declare the GitHub deployment environment.
    # The "pypi" environment must be created in repo Settings → Environments and
    # optionally configured with required reviewers / wait timers / branch restrictions.
    # Once OIDC Trusted Publisher is verified (step 4), the PYPI_API_TOKEN secret
    # can be removed entirely from this environment.
    environment: pypi
    permissions:
      contents: write
      # TD-015 step 1 (code-side): id-token: write is required for PyPI OIDC
      # Trusted Publisher. This permission is already present and must remain
      # even after deleting PYPI_API_TOKEN (step 5 — post-verification).
      id-token: write

    steps:
      # TD-015 step 6: Branch protection requirement
      # ─────────────────────────────────────────────────────────────────────
      # For OIDC Trusted Publisher to be secure, the `new-main` branch MUST be
      # protected in GitHub Settings → Branches with at least:
      #   - "Require pull request reviews before merging" (≥1 reviewer)
      #   - "Require status checks to pass" (pre-release-test, e2e-gate)
      #   - "Require branches to be up to date before merging"
      #   - "Restrict who can push to matching branches" (no direct push)
      # Without these, a malicious PR could modify release.yml / pyproject.toml
      # and trigger a publish from an unprotected commit. PyPI's Trusted Publisher
      # relies on GitHub branch protection as part of its trust chain.
      # See: https://docs.pypi.org/trusted-publishers/security-model/
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify version consistency (tag == built wheel)
        run: |
          # Extract tag version (strip leading 'v')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract built wheel version
          WHEEL=$(ls dist/carrymem-*.whl | head -1)
          WHEEL_VERSION=$(echo "$WHEEL" | sed -n 's/.*carrymem-\([^-]*\)-.*/\1/p')
          # PEP 440 normalization: tag like "0.9.3-rc1" must match wheel "0.9.3rc1".
          # `packaging.version.Version` normalizes both to the canonical form,
          # so "0.9.3-rc1" == "0.9.3rc1" after normalization. (packaging is
          # already installed because twine depends on it.)
          TAG_NORMALIZED=$(python -c "from packaging.version import Version; print(Version('$TAG_VERSION'))")
          WHEEL_NORMALIZED=$(python -c "from packaging.version import Version; print(Version('$WHEEL_VERSION'))")
          echo "Tag version:    $TAG_VERSION  (normalized: $TAG_NORMALIZED)"
          echo "Wheel version:  $WHEEL_VERSION  (normalized: $WHEEL_NORMALIZED)"
          if [ "$TAG_NORMALIZED" != "$WHEEL_NORMALIZED" ]; then
            echo "ERROR: Tag version ($TAG_VERSION → $TAG_NORMALIZED) does not match built wheel version ($WHEEL_VERSION → $WHEEL_NORMALIZED)"
            exit 1
          fi
          echo "Version consistency verified: $TAG_VERSION (normalized: $TAG_NORMALIZED)"

      # TD-015 OIDC migration REVERTED (2026-07-21):
      # ─────────────────────────────────────────────────────────────────────
      # User decided NOT to configure PyPI Trusted Publisher, reverting to
      # the traditional API token approach. The `password:` line is restored.
      #
      # Security note: the previously exposed token (leaked in conversation
      # channel twice) should still be revoked and rotated per the user's
      # own rule. If the GitHub secret PYPI_API_TOKEN still holds the exposed
      # token value, it MUST be updated with a freshly generated token from
      # https://pypi.org/manage/account/token/ before this publish step
      # can be considered secure.
      #
      # The `environment: pypi` and `id-token: write` declarations are kept
      # (harmless with password-based auth) for potential future OIDC migration.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
