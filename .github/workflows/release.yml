name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Verify version consistency (tag == built wheel)
        run: |
          # Extract tag version (strip leading 'v')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Extract built wheel version
          WHEEL=$(ls dist/carrymem-*.whl | head -1)
          WHEEL_VERSION=$(echo "$WHEEL" | sed -n 's/.*carrymem-\([^-]*\)-.*/\1/p')
          echo "Tag version:    $TAG_VERSION"
          echo "Wheel version:  $WHEEL_VERSION"
          if [ "$TAG_VERSION" != "$WHEEL_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match built wheel version ($WHEEL_VERSION)"
            exit 1
          fi
          echo "Version consistency verified: $TAG_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
