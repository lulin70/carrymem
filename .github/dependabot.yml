version: 2
updates:
  # TD-059 (2026-07-27 user decision): Only patch updates allowed for all ecosystems.
  # Rationale: minor/major upgrades introduce breaking changes (e.g., ruff/mypy version drift
  # caused 4 consecutive CI failures per project_memory lessons learned).
  # Security fixes still flow through dependabot's daily security advisory channel.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    # Group dev dependencies into a single PR to reduce noise (project_memory convention).
    # Runtime dependencies stay as individual PRs because major bumps need isolated testing.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "patch"
    ignore:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    # Group all github-actions updates into a single PR (they're low-risk and tend to bump together)
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "patch"
    ignore:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  # TD-026: docker ecosystem — auto-pin Dockerfile base image to @sha256 digest
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
    ignore:
      - dependency-type: "all"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
